<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball VR - Fight!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }
    #vrButton {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      font-size: 18px;
      background: linear-gradient(135deg, #ff6b00, #ffcc00);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      z-index: 100;
      display: none;
    }
    #vrButton:hover {
      transform: translateX(-50%) scale(1.05);
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      z-index: 100;
    }
    .key {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 4px 8px;
      border-radius: 4px;
      margin: 2px;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <button id="vrButton">🦄 Entrar en VR</button>
  <div id="controls">
    <h3>🎮 Controles (Desktop)</h3>
    <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> - Moverse</p>
    <p><span class="key">Shift</span> - Boost</p>
    <p><span class="key">Mouse</span> - Mirar</p>
    <p><span class="key">Click</span> - Kamehameha!</p>
    <p><span class="key">E</span> - Puño</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
